# Optional bundled MinIO. Not used when S3_ENDPOINT points at an existing store.
#   docker compose -f compose.yaml -f compose.bundled-minio.yaml up -d
services:
  minio:
    container_name: readest-minio
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    restart: unless-stopped
    ports:
      - "${MINIO_BIND:-0.0.0.0}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_BIND:-0.0.0.0}:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server --console-address ":9001" /data
    volumes:
      - minio-data:/data:z
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://minio:9000

  client:
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio-data:
